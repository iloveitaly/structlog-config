[project]
name = "structlog-config"
version = "0.15.0"
description = "A comprehensive structlog configuration with sensible defaults for development and production environments, featuring context management, exception formatting, and path prettification."
keywords = ["logging", "structlog", "json-logging", "structured-logging"]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "orjson>=3.10.15",
    "structlog>=25.2.0",
    "pytest-plugin-utils>=0.1.1",
]
urls = { "Repository" = "https://github.com/iloveitaly/structlog-config", "Documentation" = "https://iloveitaly.github.io/structlog-config/" }
authors = [{ name = "Michael Bianco", email = "mike@mikebian.co" }]

[project.optional-dependencies]
fastapi = ["fastapi", "fastapi-ipware>=0.1.0", "starlette-context"]

[project.entry-points.pytest11]
structlog_config = "structlog_config.pytest_plugin"

[build-system]
requires = ["uv_build>=0.11.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# avoids the src/ directory structure
module-root = ""

[tool.uv.sources]

[dependency-groups]
test-additions = [
    "whenever>=0.9.3",
    "beautiful-traceback>=1.0.0",
    "activemodel>=0.18.0",
    "sqlalchemy>=2.0.48",
    "typeid-python>=0.3.3",
]
dev = [
    "pytest>=8.3.4",
    "httpx>=0.28.1",
    "pyright[nodejs]>=1.1.408",
    "ruff>=0.15.0",
    "coverage>=7.13.4",
    "pytest-cov>=7.0.0",
    "covdefaults>=2.3.0",
    "beautiful-traceback>=1.0.2",
]
# Sphinx toolchain for local/CI docs builds — not a published package extra
docs = [
    "sphinx>=7.1.2",
    "shibuya",
    "myst-parser>=2.0.0",
    "sphinx-design>=0.5.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-autobuild",
    "sphinx-autoapi",
    "sphinx-llm",
]

[tool.pyright]
exclude = ["examples/", "playground/", "tmp/", ".venv/", "tests/", "docs/_build/", "docs/autoapi/"]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing --cov-report=html:tmp/htmlcov"
testpaths = ["tests"]

[tool.coverage.run]
plugins = ["covdefaults"]
source = ["structlog_config"]

[tool.coverage.report]
fail_under = 50

[tool.uv.sources.beautiful-traceback]
git = "https://github.com/iloveitaly/beautiful-traceback.git"

